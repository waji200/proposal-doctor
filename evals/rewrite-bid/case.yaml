schema_version: "1.1"
name: rewrite-bid
expected_outcome: |
  Claude reviews the draft against the job post, says plainly that it is generic and would be
  skipped, and delivers a rewritten plain-text proposal that opens with a detail from the job
  (14 apps, Dawn, PageSpeed 28) instead of a greeting or self-introduction, uses only the
  experience the user supplied (35 to 74 on a Dawn store, screenshots, duplicate theme, 3 days),
  contains no stock or AI-flavoured phrases, and ends with one easy question for the client.
context:
  scaffold_script: place-files.sh
